name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check client.js
          node --check index.js
      - name: Catalog
        run: node scripts/validate-catalog.mjs
      - name: Client and dictionaries
        run: node scripts/check-client.mjs
      - name: Archive behaviour
        run: node scripts/test-archive.mjs
