name: Feature request
description: Suggest an improvement for the Skills page
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow that is awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Catalog and install
        - Editor and versions
        - Comparison and AI improvement
        - Archive
        - Workspaces
        - Localization
        - Other
